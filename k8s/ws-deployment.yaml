# ============================================================
# ws-deployment.yaml
#
# WHY: Runs the WebSocket server inside Kubernetes.
#
# SCALING WITH REDIS:
# The ws-server uses Redis Pub/Sub (REDIS_URL env var) to fan
# out drawing events across multiple pods. With Redis present,
# you can safely scale replicas > 1.
# Without REDIS_URL the server degrades to single-pod only
# (in-memory room state).
#
# TRAFFIC FLOW:
#   Browser → Ingress (/ws) → ws-server Service → pods
#   (WebSocket upgrade happens at the Ingress level)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: collabdraw
  labels:
    app: ws-server
spec:
  replicas: 2              # Safe to run >1 because Redis fan-out is configured
  selector:
    matchLabels:
      app: ws-server
  template:
    metadata:
      labels:
        app: ws-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ws-server
          image: 494487213388.dkr.ecr.ap-south-1.amazonaws.com/collabdraw-ws:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: collabdraw-config
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: collabdraw-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: collabdraw-config
                  key: NODE_ENV
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: collabdraw-config
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
