# ============================================================
# secret.yaml
#
# WHY: Secrets store sensitive values separately from code.
# Kubernetes base64-encodes them (NOT encrypts — just encodes).
# In a real cluster you'd use AWS Secrets Manager or Vault,
# but for a student project this is the standard approach.
#
# HOW TO GENERATE base64 values:
#   echo -n "your-value-here" | base64
#
# The values below are examples — change before deploying.
#   "postgres"       → cG9zdGdyZXM=
#   "supersecret123" → c3VwZXJzZWNyZXQxMjM=
#
# IMPORTANT: Never commit real secrets to Git.
# Add secret.yaml to .gitignore in production.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: collabdraw-secret
  namespace: collabdraw
type: Opaque
data:
  # base64 of "postgres"
  POSTGRES_PASSWORD: cG9zdGdyZXM=

  # base64 of "supersecret123" — change this to something long and random
  JWT_SECRET: c3VwZXJzZWNyZXQxMjM=
