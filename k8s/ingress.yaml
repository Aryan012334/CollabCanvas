# ============================================================
# ingress.yaml — AWS EKS version (ALB)
#
# TRAFFIC FLOW:
#   Browser → AWS ALB (auto-created by ALB Controller)
#     /api/*  → http-backend:3001  (strips /api prefix)
#     /ws     → ws-server:4000     (WebSocket upgrade)
#     /       → frontend:3000
#
# WEBSOCKET NOTE:
#   target-type: ip is REQUIRED for WebSocket.
#   Without it, the ALB uses instance mode which breaks
#   the WebSocket upgrade handshake.
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabdraw-ingress
  namespace: collabdraw
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

spec:
  rules:
    - http:
        paths:

          # REST API — /api/* → http-backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: http-backend
                port:
                  number: 3001

          # WebSocket — /ws → ws-server
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ws-server
                port:
                  number: 4000

          # Frontend — everything else → Next.js
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000



