# ============================================================
# frontend-deployment.yaml
#
# WHY: Runs the Next.js frontend inside Kubernetes.
#
# KEY POINT ABOUT NEXT_PUBLIC_* VARIABLES:
# These URLs are baked into the JavaScript bundle at BUILD TIME.
# They cannot be changed at runtime via environment variables.
# This means the Docker image must be built with the correct
# production URLs already set as build arguments.
#
# The values here (NODE_ENV, PORT) are the only runtime vars
# Next.js actually reads after the build.
#
# TRAFFIC FLOW:
#   Browser → Ingress (/) → frontend Service → this pod
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: collabdraw
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with your actual image after pushing to ECR/Docker Hub
          image: collabdraw-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
