# ============================================================
# postgres-deployment.yaml
#
# WHY: Runs the PostgreSQL database inside Kubernetes.
# We use a Deployment (not a StatefulSet) to keep it simple
# for a student project. In production you'd use a managed
# database like AWS RDS instead of running Postgres in K8s.
#
# The PersistentVolumeClaim (PVC) ensures data survives
# pod restarts — without it, all data is lost when the
# container restarts.
# ============================================================

# ── PersistentVolumeClaim ──────────────────────────────────
# Requests a 1GB storage volume from the cluster.
# On EKS this automatically creates an EBS volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: collabdraw
spec:
  accessModes:
    - ReadWriteOnce        # One pod can read/write at a time (fine for Postgres)
  resources:
    requests:
      storage: 1Gi

---

# ── Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: collabdraw
  labels:
    app: postgres
spec:
  replicas: 1              # Always 1 for a database (data consistency)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "collabdraw"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: collabdraw-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
